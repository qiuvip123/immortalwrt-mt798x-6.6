name: Build A31 + Q30 Pro (24.10 / 6.6 + Tailscale UI + NMBM)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty to only upload artifact)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Clone upstream 6.6 source
        run: |
          git clone --depth 1 -b openwrt-24.10-6.6 https://github.com/Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly src
          cd src
          git log --oneline -1

      - name: Add luci-app-tailscale
        run: |
          cd src
          git clone --depth 1 https://github.com/whzhni1/luci-app-tailscale.git /tmp/tsapp
          rm -rf package/luci-app-tailscale
          cp -r /tmp/tsapp/luci-app-tailscale package/luci-app-tailscale
          test -f package/luci-app-tailscale/Makefile
          grep -E 'PKG_VERSION|PKG_RELEASE|LUCI_DEPENDS' package/luci-app-tailscale/Makefile

      - name: Patch Q30 Pro to U-Boot + fit layout
        run: |
          cd src
          python3 - <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(".")
          MK = root / "target/linux/mediatek/image/filogic.mk"
          DTS = root / "target/linux/mediatek/dts/mt7981b-jcg-q30-pro.dts"

          OLD_MK = """define Device/jcg_q30-pro
            DEVICE_VENDOR := JCG
            DEVICE_MODEL := Q30 PRO
            DEVICE_DTS := mt7981b-jcg-q30-pro
            DEVICE_DTS_DIR := ../dts
            BLOCKSIZE := 128k
            PAGESIZE := 2048
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          endef"""

          NEW_MK = """define Device/jcg_q30-pro
            DEVICE_VENDOR := JCG
            DEVICE_MODEL := Q30 PRO
            DEVICE_DTS := mt7981b-jcg-q30-pro
            DEVICE_DTS_DIR := ../dts
            DEVICE_DTS_LOADADDR := 0x43f00000
            KERNEL_LOADADDR := 0x44000000
            KERNEL_IN_UBI := 1
            UBOOTENV_IN_UBI := 1
            BLOCKSIZE := 128k
            PAGESIZE := 2048
            IMAGES := sysupgrade.itb
            KERNEL_INITRAMFS_SUFFIX := -recovery.itb
            KERNEL := kernel-bin | gzip
            KERNEL_INITRAMFS := kernel-bin | lzma | fit lzma $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb with-initrd | pad-to 64k
            IMAGE/sysupgrade.itb := append-kernel | fit gzip $$(KDIR)/image-$$(firstword $$(DEVICE_DTS)).dtb external-static-with-rootfs | append-metadata
            ARTIFACTS := preloader.bin bl31-uboot.fip
            ARTIFACT/preloader.bin := mt7981-bl2 spim-nand-ddr3
            ARTIFACT/bl31-uboot.fip := mt7981-bl31-uboot jcg_q30-pro
          endef"""

          OLD_CHOSEN = '\tchosen {\n\n\t\tstdout-path = "serial0:115200n8";\n\t};'
          NEW_CHOSEN = ('\tchosen {\n'
                        '\t\tbootargs = "root=/dev/fit0 rootwait";\n'
                        '\t\trootdisk = <&ubi_rootdisk>;\n'
                        '\t\tstdout-path = "serial0:115200n8";\n'
                        '\t};')

          OLD_UBI = ('\t\t\tubi: partition@580000 {\n'
                     '\t\t\t\tlabel = "ubi";\n'
                     '\t\t\t\treg = <0x0580000 0x7000000>;\n'
                     '\t\t\t};')

          NEW_UBI = ('\t\t\tubi: partition@580000 {\n'
                     '\t\t\t\tcompatible = "linux,ubi";\n'
                     '\t\t\t\tlabel = "ubi";\n'
                     '\t\t\t\treg = <0x0580000 0x7000000>;\n'
                     '\n'
                     '\t\t\t\tvolumes {\n'
                     '\t\t\t\t\tubi_rootdisk: ubi-volume-fit {\n'
                     '\t\t\t\t\t\tvolname = "fit";\n'
                     '\t\t\t\t\t};\n'
                     '\t\t\t\t};\n'
                     '\t\t\t};')

          def patch(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if new in text:
                  print("[skip] %s already patched" % label)
                  return
              if old not in text:
                  print("[FAIL] anchor not found: %s" % label, file=sys.stderr)
                  sys.exit(1)
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("[ok] %s" % label)

          patch(MK, OLD_MK, NEW_MK, "filogic.mk Device/jcg_q30-pro")
          patch(DTS, OLD_CHOSEN, NEW_CHOSEN, "dts chosen rootdisk")
          patch(DTS, OLD_UBI, NEW_UBI, "dts ubi fit volume")
          print("patch done")
          PY

      - name: Patch A31 NMBM + align ubi to 896 PEB
        run: |
          cd src
          python3 - <<'PY'
          import pathlib
          import sys

          DTS = pathlib.Path("target/linux/mediatek/dts/mt7981b-konka-komi-a31.dts")

          OLD = ('\t\tspi-rx-bus-width = <4>;\n'
                 '\n'
                 '\t\tpartitions {\n'
                 '\t\t\tcompatible = "fixed-partitions";\n')

          NEW = ('\t\tspi-rx-bus-width = <4>;\n'
                 '\n'
                 '\t\tmediatek,nmbm;\n'
                 '\t\tmediatek,bmt-max-ratio = <1>;\n'
                 '\t\tmediatek,bmt-max-reserved-blocks = <64>;\n'
                 '\n'
                 '\t\tpartitions {\n'
                 '\t\t\tcompatible = "fixed-partitions";\n')

          OLD_REG = '\t\t\t\treg = <0x580000 0x7a80000>;'
          NEW_REG = '\t\t\t\treg = <0x580000 0x7000000>;'

          def patch(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if new in text:
                  print("[skip] %s already patched" % label)
                  return
              if old not in text:
                  print("[FAIL] anchor not found: %s" % label, file=sys.stderr)
                  sys.exit(1)
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("[ok] %s" % label)

          patch(DTS, OLD, NEW, "mediatek,nmbm on spi_nand")
          patch(DTS, OLD_REG, NEW_REG, "ubi partition 112 MiB = 896 PEB")

          for line in DTS.read_text(encoding="utf-8").splitlines():
              s = line.strip()
              if "nmbm" in s or "0x7000000" in s or "0x7a80000" in s:
                  print("  checked:", s)
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Update and install feeds
        run: |
          cd src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd src
          cp defconfig/mt7981-ax3000.config .config
          {
            echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_konka_komi-a31=y'
            echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_konka_komi_a31=y'
            echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30-pro=y'
            echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30_pro=y'
            echo 'CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30=y'
            echo 'CONFIG_MTD_NAND_MTK_BMT=y'
            echo 'CONFIG_PACKAGE_luci-app-tailscale=y'
            echo 'CONFIG_PACKAGE_kmod-tun=y'
            echo 'CONFIG_PACKAGE_curl=y'
            echo 'CONFIG_PACKAGE_luci-app-ttyd=y'
            echo 'CONFIG_PACKAGE_luci-app-filetransfer=y'
          } >> .config
          make defconfig
          echo '=== devices selected ==='
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config || true
          echo '=== nmbm / tailscale / tun ==='
          grep -E 'MTD_NAND_MTK_BMT|luci-app-tailscale|kmod-tun|PACKAGE_curl' .config || true

      - name: Download sources
        run: |
          cd src
          make download -j8

      - name: Build firmware
        run: |
          cd src
          nproc
          make -j$(nproc) V=s

      - name: Collect images
        run: |
          cd src
          mkdir -p ../output
          ls -lh bin/targets/mediatek/filogic/
          cp -v bin/targets/mediatek/filogic/*konka_komi-a31* ../output/ || true
          cp -v bin/targets/mediatek/filogic/*jcg_q30-pro* ../output/ || true
          cp -v bin/targets/mediatek/filogic/*.manifest ../output/ || true
          cp -v bin/targets/mediatek/filogic/*.config ../output/ || true
          cd ../output
          ls -lh
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Verify both devices built
        run: |
          cd output
          ls | grep -q 'konka_komi-a31.*sysupgrade.itb' || { echo 'missing A31 sysupgrade.itb'; exit 1; }
          ls | grep -q 'jcg_q30-pro.*sysupgrade.itb' || { echo 'missing Q30 sysupgrade.itb'; exit 1; }
          echo 'both sysupgrade images present'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: a31-q30-2410-tailscale-nmbm
          path: output/

      - name: Create Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
