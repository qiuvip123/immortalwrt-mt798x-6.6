name: Build Konka A31 Firmware

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for artifact only)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add istore feed
        run: |
          echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt full-upgrade -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Update feeds
        run: ./scripts/feeds update -a

      - name: Install feeds
        run: ./scripts/feeds install -a

      - name: Load A31 defconfig
        run: |
          cp -f defconfig/mt7981-konka-a31-custom.config .config
          make defconfig

      - name: Download package sources
        run: make download -j8

      - name: Build firmware
        run: |
          nproc
          make -j$(nproc) V=s

      - name: Prepare output files
        run: |
          mkdir -p output
          ls -lh bin/targets/mediatek/mt7981/ | grep -E 'factory|sysupgrade|initramfs'
          cp bin/targets/mediatek/mt7981/*konka*a31*factory*.bin output/ 2>/dev/null || true
          cp bin/targets/mediatek/mt7981/*konka*a31*sysupgrade*.bin output/ 2>/dev/null || true
          cp bin/targets/mediatek/mt7981/*.manifest output/ 2>/dev/null || true
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: konka-a31-firmware
          path: output/

      - name: Create Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.release_tag }}
          files: |
            output/*.bin
            output/*.manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
